name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
        working-directory: .
      - name: Run test suite (default marker excludes live_models)
        run: python -m pytest -q
        working-directory: backend
      - name: Run offline regression eval
        run: python -m evals.run --offline --topics 3
        working-directory: backend

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      # Known-vulnerable pins fail the build; a fix is a version bump + re-pin,
      # not a workflow change.
      - run: python -m pip_audit --strict -r backend/requirements.txt

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
