[pytest]
# Root-level, not backend/pytest.ini: pytest's rootdir search walks upward
# from cwd, it never descends into subdirectories — a config file inside
# backend/ is invisible when pytest is invoked from the repo root, which
# caused markers to go unregistered ("Unknown pytest.mark.live_models")
# depending on which directory you happened to run it from.
testpaths = backend/tests
markers =
    live_models: hits the provider catalog over the network; excluded by default
# Network-dependent checks stay opt-in so the default suite is offline and fast.
addopts = -m "not live_models"
